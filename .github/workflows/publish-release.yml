name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate semver tag
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Non-semver tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Decide latest flag
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --tags --force
          latest_tag="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"
          if [[ "$tag" == "$latest_tag" ]]; then
            echo "RELEASE_LATEST_FLAG=--latest" >> "$GITHUB_ENV"
          else
            echo "RELEASE_LATEST_FLAG=--latest=false" >> "$GITHUB_ENV"
          fi

      - name: Create or update latest release
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --verify-tag --title "$tag" --draft=false "$RELEASE_LATEST_FLAG"
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag" "$RELEASE_LATEST_FLAG"
          fi

      - name: Build release zip
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="secondbrain-${tag}.zip"
          git archive --format=zip --prefix=secondbrain/ -o "$RUNNER_TEMP/$asset" HEAD:secondbrain
          echo "RELEASE_ASSET=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_NAME=$asset" >> "$GITHUB_ENV"

      - name: Validate built release zip
        run: |
          python3 secondbrain/scripts/validate_distribution.py --zip-path "$RELEASE_ASSET" --expected-tag "${GITHUB_REF_NAME}" --expected-asset-name "$RELEASE_ASSET_NAME"

      - name: Upload release zip
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" "$RELEASE_ASSET" --clobber

      - name: Validate published release asset
        run: |
          tag="${GITHUB_REF_NAME}"
          download_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$download_dir"
          gh release download "$tag" --pattern "$RELEASE_ASSET_NAME" --dir "$download_dir"
          python3 secondbrain/scripts/validate_distribution.py --zip-path "$download_dir/$RELEASE_ASSET_NAME" --expected-tag "$tag" --expected-asset-name "$RELEASE_ASSET_NAME"
