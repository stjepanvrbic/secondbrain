name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for test suite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-mock

      - name: Run tests
        run: python3 -m pytest tests/ -q --no-header

      - name: Verify version matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_NAME#v}"
          VERSION=$(python3 -c 'import json; print(json.load(open("secondbrain/.claude-plugin/plugin.json"))["version"])')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match plugin.json version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes --title "$TAG_NAME"
