name: Auto Release Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release-main:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Decide whether to skip this push
        id: skip
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          skip="$(python3 secondbrain/scripts/auto_release.py should-skip --actor "$RELEASE_ACTOR" --head-commit-message "$RELEASE_HEAD_COMMIT_MESSAGE")"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Validate release automation inputs
        if: steps.skip.outputs.skip != '1'
        run: |
          python3 secondbrain/scripts/bump_version.py --check
          pytest tests/test_auto_release.py tests/test_bump_version.py tests/test_plugin_manifest.py tests/test_release_workflow_files.py tests/test_validate_distribution.py -q

      - name: Configure git identity
        if: steps.skip.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next release version
        if: steps.skip.outputs.skip != '1'
        id: release
        run: |
          next_version="$(python3 secondbrain/scripts/auto_release.py next-version --repo-root "$GITHUB_WORKSPACE")"
          release_asset="$(python3 secondbrain/scripts/auto_release.py release-asset "$next_version")"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "release_asset=$release_asset" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        if: steps.skip.outputs.skip != '1'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          next_version='${{ steps.release.outputs.next_version }}'
          release_asset='${{ steps.release.outputs.release_asset }}'

          python3 secondbrain/scripts/bump_version.py "$next_version" --git-tag "v$next_version" --git-commit "$SOURCE_SHA" --release-asset "$release_asset"
          git add -- .claude-plugin/marketplace.json secondbrain/.claude-plugin/plugin.json secondbrain/.claude-plugin/release.json secondbrain/skills/*/SKILL.md
          git commit -m "release: v$next_version"

          git tag -a "v$next_version" -m "v$next_version"
          python3 secondbrain/scripts/validate_distribution.py --expected-tag "v$next_version" --expected-asset-name "$release_asset"
          git push origin HEAD:main "v$next_version"

      - name: Publish release asset
        if: steps.skip.outputs.skip != '1'
        run: |
          next_version='${{ steps.release.outputs.next_version }}'
          release_asset='${{ steps.release.outputs.release_asset }}'
          tag="v$next_version"
          asset_path="$RUNNER_TEMP/$release_asset"
          download_dir="$RUNNER_TEMP/published-release"

          git archive --format=zip --prefix=secondbrain/ -o "$asset_path" HEAD:secondbrain
          python3 secondbrain/scripts/validate_distribution.py --zip-path "$asset_path" --expected-tag "$tag" --expected-asset-name "$release_asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --verify-tag --title "$tag" --draft=false --latest
            gh release upload "$tag" "$asset_path" --clobber
          else
            gh release create "$tag" "$asset_path" --verify-tag --generate-notes --title "$tag" --latest
          fi

          mkdir -p "$download_dir"
          gh release download "$tag" --pattern "$release_asset" --dir "$download_dir"
          python3 secondbrain/scripts/validate_distribution.py --zip-path "$download_dir/$release_asset" --expected-tag "$tag" --expected-asset-name "$release_asset"
